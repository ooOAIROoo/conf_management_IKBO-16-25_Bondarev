[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depviz"
version = "0.1.0"
description = "Инструмент визуализации графа зависимостей для менеджера пакетов (Java/Maven). Этап 1: минимальный CLI-прототип с конфигурацией."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
depviz = "depviz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
